<title>أبو سجاد للمسكوف - نظام الكاشير</title>
<style>
:root{--bg:#0a1118;--panel:#101b26;--card:#162433;--card2:#1c2f42;--line:#23384d;--tx:#e9eff6;--mut:#8ea3b8;--gold:#f5a524;--gold2:#ffc75a;--sea:#14b8a6;--red:#ef4444;--green:#22c55e;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;user-select:none;font-size:15px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:#0c1720;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;user-select:text;width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f5a52422}
select option{background:#0c1720}
input.pw{-webkit-text-security:disc;font-family:Verdana,sans-serif;letter-spacing:2px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
input[type=date]{color-scheme:dark}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a4258;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;transition:.15s;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.18)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#e07b00);color:#1d1100;border:0}
.btn.green{background:linear-gradient(135deg,#2bd46a,#15803d);border:0;color:#fff}
.btn.sea{background:linear-gradient(135deg,#2dd4bf,#0f766e);border:0;color:#fff}
.btn.danger{background:#3a1518;border-color:#7f1d1d;color:#fca5a5}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;pointer-events:none}
.mut{color:var(--mut)}.hidden{display:none!important}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
label.chk{display:flex;align-items:center;gap:10px;cursor:pointer}

/* ===== Login ===== */
.login{height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 80% -10%,#f5a52422,transparent),radial-gradient(900px 500px at 0% 110%,#14b8a622,transparent),var(--bg)}
.lcard{width:420px;background:linear-gradient(180deg,#132232,#0f1b27);border:1px solid var(--line);border-radius:22px;padding:34px 32px;box-shadow:0 30px 80px #0008;text-align:center}
.lcard .lg{width:96px;height:96px;margin:0 auto 12px;border-radius:26px;background:linear-gradient(135deg,var(--gold2),#e06a00);display:grid;place-items:center;font-size:52px;box-shadow:0 10px 30px #f5a52455;overflow:hidden}
.lcard .lg img{width:100%;height:100%;object-fit:cover}
.lcard h1{font-size:26px;font-weight:900}.lcard .sl{color:var(--mut);margin:4px 0 18px}
.lcard form{display:flex;flex-direction:column;gap:12px;text-align:right}
.lclock{margin-top:18px;color:var(--mut);font-size:13px}
.hint{background:#f5a52414;border:1px dashed #f5a52466;color:var(--gold2);border-radius:10px;padding:8px;font-size:13px}

/* ===== Shell ===== */
.top{height:66px;display:flex;align-items:center;gap:18px;padding:0 18px;background:linear-gradient(180deg,#111f2c,#0d1822);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex-shrink:0}
@media(max-width:1500px){.brand small{display:none}.top{gap:10px}.bkst{padding:5px 8px}}
.brand .lg{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--gold2),#e06a00);display:grid;place-items:center;font-size:26px;overflow:hidden}
.brand .lg img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:18px;font-weight:900}.brand small{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;flex:1}
nav button{white-space:nowrap;background:transparent;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:700;font-size:15px}
nav button:hover{background:#ffffff0a;color:var(--tx)}
nav button.on{background:#f5a5241c;color:var(--gold2)}
.clock{text-align:center;line-height:1.2}.clock b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold2)}.clock small{display:block;color:var(--mut);font-size:12px}
.me{display:flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid var(--line)}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.me div{line-height:1.2}.me small{color:var(--mut);font-size:12px}
main#view{height:calc(100vh - 66px);overflow:hidden}

/* ===== POS ===== */
.pos{display:grid;grid-template-columns:150px 1fr 410px;grid-template-rows:100%;height:100%;overflow:hidden}.pos>*{min-height:0;overflow:hidden}
.cats{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto!important;padding:10px;display:flex;flex-direction:column;gap:10px}
.ctile{border-radius:var(--r);overflow:hidden;flex-shrink:0;cursor:pointer;border:2px solid transparent;background:var(--card);transition:.15s;flex-shrink:0}
.ctile:hover{transform:translateY(-2px)}
.ctile.on{border-color:var(--gold);box-shadow:0 0 0 3px #f5a52433}
.ctile .im{height:74px;display:grid;place-items:center;font-size:40px;position:relative}
.ctile .im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ctile .nm{padding:7px 6px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.25}
.ctile .nm small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.menu{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.mhead{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:19px;white-space:nowrap}
.mhead input{max-width:340px;margin-right:auto}
.items{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column}
.icard:hover{border-color:#f5a52488;transform:translateY(-2px);box-shadow:0 10px 24px #0006}
.icard:active{transform:scale(.97)}
.icard .im{height:100px;flex-shrink:0;display:grid;place-items:center;font-size:48px;position:relative}
.icard .im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.icard .nm{padding:8px 10px 2px;font-weight:700;font-size:14px;line-height:1.3;flex:1}
.icard .pr{padding:0 10px 10px;color:var(--gold2);font-weight:800;font-size:15px}
.icard .pr small{color:var(--mut);font-weight:400;font-size:11px}
.badge{position:absolute;top:8px;left:8px;background:#000a;backdrop-filter:blur(4px);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px;z-index:2}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0;font-size:16px}

.cart{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.nextno small{color:var(--mut);font-size:12px;display:block}
.nextno b{font-size:30px;font-weight:900;color:var(--gold2);line-height:1}
.seg{display:flex;background:#0c1720;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--mut);font-size:13.5px}
.seg button.on{background:var(--gold);color:#1d1100}
.cextra{padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.cextra input{padding:8px 10px}
.lines{flex:1;overflow-y:auto;padding:8px 10px;min-height:0}
.line{display:grid;grid-template-columns:1fr auto 78px 26px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px;animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.line b{font-size:14px;display:block;line-height:1.3}.line small{color:var(--mut);font-size:12px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:17px;font-weight:800;line-height:1}
.qty button:hover{background:var(--gold);color:#000}
.qty span{min-width:26px;text-align:center;font-weight:800}
.ltot{text-align:left;font-weight:800;font-size:14px}
.line .x{width:26px;height:26px;border-radius:8px;border:0;background:#3a1518;color:#fca5a5;cursor:pointer}
.cempty{text-align:center;color:var(--mut);padding:50px 10px}.cempty div{font-size:50px;opacity:.5;margin-bottom:8px}
.sum{border-top:1px solid var(--line);padding:8px 14px;display:flex;flex-direction:column;gap:5px;background:#0d1822}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow input{width:130px;padding:5px 10px;text-align:left}
.srow.big{font-size:22px;font-weight:900;padding:4px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.srow.big span:last-child{color:var(--gold2)}
.qcash{display:flex;gap:5px;flex-wrap:wrap}
.qcash button{flex:1;padding:6px 4px;font-size:12.5px}
.change{font-weight:800}.change.neg{color:var(--red)}.change.pos{color:var(--green)}
.cact{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.cact .pay{font-size:18px;padding:14px}

/* ===== Pages ===== */
.page{height:100%;overflow-y:auto;padding:20px 24px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{font-size:22px;margin-left:auto}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:16px}
.toolbar label.f{min-width:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(160deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{color:var(--mut);display:block;margin-bottom:4px}.stat b{font-size:24px;font-weight:900}
.stat.g b{color:var(--gold2)}.stat.s b{color:var(--sea)}.stat.r b{color:#fca5a5}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:#0d1822;color:var(--mut);font-weight:700;font-size:13px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid #1a2b3c;font-size:14px}
.tbl tr:last-child td{border-bottom:0}.tbl tr:hover td{background:#ffffff05}
.tbl .num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.tag.ok{background:#22c55e22;color:#86efac}.tag.no{background:#ef444422;color:#fca5a5}.tag.gd{background:#f5a52422;color:var(--gold2)}.tag.bl{background:#14b8a622;color:#5eead4}
.thumb{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:24px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:12px;width:max-content}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:700}
.tabs button.on{background:var(--gold);color:#1d1100}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}

.bars .bar span:last-child{text-align:left;font-weight:700}

/* ===== Modal ===== */
.modal-wrap{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(180deg,#14263a,#101d2a);border:1px solid var(--line);border-radius:20px;padding:22px;width:560px;max-width:94vw;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px #000a;animation:pop .18s}
.modal.sm{width:400px}.modal.lg{width:760px}

.mbtns{display:flex;gap:10px;margin-top:18px}.mbtns .btn{flex:1;padding:12px}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .pv{width:90px;height:90px;border-radius:14px;display:grid;place-items:center;font-size:44px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.colors{display:flex;gap:6px;flex-wrap:wrap}.colors i{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent}.colors i.on{border-color:#fff}
.wdisp{display:flex;align-items:center;gap:10px;margin:8px 0}
.wdisp input{font-size:34px;font-weight:900;text-align:center;padding:10px;color:var(--gold2)}

async function boot(){
  try{await DB.open()}catch(e){document.body.innerHTML='<h2 style="padding:40px">تعذر فتح قاعدة البيانات</h2>';return}
  await deskInit();
  SYNC.suspend=true;
  const fresh=!(await DB.get('users'))&&!(await DB.maxInv());
  S.settings=Object.assign({},DEFAULT_SETTINGS,await DB.get('settings')||{});
  S.users=await DB.get('users')||[];
  if(!S.users.length){S.users=[{id:uid(),name:'المدير',username:'admin',pass:await hashPw('admin123'),role:'admin',active:true}];await saveUsers()}
  S.cats=await DB.get('cats');S.items=await DB.get('items');
  if(!S.cats||!S.items||(S.settings.menuVer||0)<MENU_VER){
    S.cats=SEED_CATS.map((c,i)=>({id:uid()+'c'+i,name:c[0],emoji:c[1],color:c[2],img:c[3]?IMG[c[3]]:'',order:i}));
    S.items=SEED_ITEMS.map((it,i)=>({id:uid()+'i'+i,cat:S.cats[it[0]].id,name:it[1],price:it[2],byWeight:!!it[3],weightList:it[3]===2,emoji:it[4],img:it[5]?IMG[it[5]]:'',active:true}));
    Object.assign(S.settings,{menuVer:MENU_VER,phone:DEFAULT_SETTINGS.phone,address:DEFAULT_SETTINGS.address});
    CURCAT='all';await saveCats();await saveItems()}
  const mx=await DB.maxInv();if(S.settings.nextNo<=mx)S.settings.nextNo=mx+1;
  await saveSettings();applyPageStyle();
  SYNC.sig=setSig();SYNC.suspend=false;await syncInit();
  const sid=sessionStorage.getItem('uid');ME=S.users.find(u=>u.id===sid&&u.active)||null;
  ME?renderShell():renderLogin();
  setInterval(tick,1000);tick();
  if(fresh&&DESK.on&&DESK.info.hasLatest)offerRestoreLatest(true);
}
function applyPageStyle(){const w=+S.settings.paper===58?48:72;$('#pageStyle').textContent=`.rc{width:${w}mm}`}

/* ---------------- UI helpers ---------------- */
function toast(m,t=''){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function modal(html,cls=''){const m=$('#modal');m.className='modal '+cls;m.innerHTML=html;$('#modalWrap').classList.remove('hidden');setTimeout(()=>{const f=m.querySelector('[autofocus]');f&&f.focus()},60)}
function closeModal(){if(VK.t&&$('#modal').contains(VK.t))vkHide();$('#modalWrap').classList.add('hidden');$('#modal').innerHTML=''}
const modalOpen=()=>!$('#modalWrap').classList.contains('hidden');
function confirmBox(msg,okTxt='نعم'){return new Promise(res=>{modal(`<h3>⚠️ تأكيد</h3><p style="font-size:16px;line-height:1.7">${msg}</p><div class="mbtns"><button class="btn danger" id="cOk">${okTxt}</button><button class="btn" id="cNo">إلغاء</button></div>`,'sm');
  $('#cOk').onclick=()=>{closeModal();res(true)};$('#cNo').onclick=()=>{closeModal();res(false)}})}
function readImage(file,max=420,type='image/jpeg'){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.82))};im.src=fr.result};fr.readAsDataURL(file)})}

   <form id="lf"><label class="f">اسم المستخدم<input id="lu" autofocus autocomplete="off"></label>
   <label class="f">كلمة المرور<input id="lp" class="pw" autocomplete="off" autocorrect="off" spellcheck="false"></label>
   <button class="btn gold" style="padding:13px;font-size:17px;margin-top:6px">🔐 تسجيل الدخول</button>
   ${def?`<div class="hint">الدخول الأول: <b>admin</b> / <b>admin123</b> — غيّرها من الإدارة</div>`:''}</form>
   <div class="lclock" id="lclk"></div></div></div>`;
  $('#lu').focus();tick();
  $('#lf').onsubmit=async e=>{e.preventDefault();const un=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value;
    const u=S.users.find(x=>x.username.toLowerCase()===un);
    if(!u||u.pass!==await hashPw(pw))return toast('اسم المستخدم أو كلمة المرور غير صحيحة','err');

    ME=u;sessionStorage.setItem('uid',u.id);VIEW='pos';renderShell();toast(`أهلاً ${u.name}`,'ok')}
}

async function gatherInvoices(from,to){

let REPF=null;
function renderReports(){
  const today=dayKey(new Date());REPF=REPF||{from:today,to:today};
  $('#view').innerHTML=`<div class="page"><div class="ph"><h2>📊 تقارير المبيعات</h2></div>
   <div class="toolbar"><label class="f">من تاريخ<input type="date" id="r1" value="${REPF.from}"></label><label class="f">إلى تاريخ<input type="date" id="r2" value="${REPF.to}"></label>
    ${srcSelect()}
    <button class="btn gold" onclick="loadReport()">📊 عرض التقرير</button>
    <button class="btn" onclick="quickRange(0)">اليوم</button><button class="btn" onclick="quickRange(1)">أمس</button><button class="btn" onclick="quickRange(7)">آخر 7 أيام</button><button class="btn" onclick="quickRange(30)">آخر 30 يوم</button>
    <button class="btn sea" style="margin-right:auto" onclick="printReport()">🖨️ طباعة تقرير الإغلاق</button></div>
   <div id="rep"></div></div>`;
  if($('#fsrc'))$('#fsrc').onchange=e=>{SRC=e.target.value;loadReport()};
  loadReport();

function quickRange(n){const t=new Date();let a=new Date(t),b=new Date(t);if(n===1){a.setDate(t.getDate()-1);b=new Date(a)}else if(n>1)a.setDate(t.getDate()-(n-1));
  REPF={from:dayKey(a),to:dayKey(b)};renderReports()}
let REPDATA=null;
async function loadReport(){
  REPF={from:$('#r1').value,to:$('#r2').value};
  $('#rep').innerHTML=`<div class="box mut" style="text-align:center;padding:40px">⏳ جاري تجهيز التقرير${multiSrc()&&SRC!=='local'?' من كل الحاسبات':''}...</div>`;
  const g=await gatherInvoices(REPF.from||'0000',REPF.to||'9999');const list=g.list;
  if(g.warn)toast('⚠️ تعذر جلب مبيعات الحاسبات الأخرى: '+g.warn,'err');
  const ok=list.filter(i=>i.status!=='cancelled'),can=list.filter(i=>i.status==='cancelled');
  const sum=(a,f)=>a.reduce((x,i)=>x+f(i),0);
  const grp=(arr,kf,vf)=>{const m={};arr.forEach(x=>{const k=kf(x);m[k]=m[k]||{n:0,t:0};m[k].n+=vf?vf(x).n:1;m[k].t+=vf?vf(x).t:x.total});return Object.entries(m).sort((a,b)=>b[1].t-a[1].t)};
  const lines=ok.flatMap(i=>i.items);
  const R={from:REPF.from,to:REPF.to,count:ok.length,total:sum(ok,i=>i.total),disc:sum(ok,i=>i.discount),del:sum(ok,i=>i.delivery),canN:can.length,canT:sum(can,i=>i.total),
    byDev:g.multi?grp(ok,i=>i._devName||'—'):null,
    byUser:grp(ok,i=>i.userName),byType:grp(ok,i=>i.type),byDay:grp(ok,i=>i.day).sort((a,b)=>a[0]<b[0]?-1:1),
    byCat:grp(lines,l=>l.catName||'بدون قسم',l=>({n:l.qty,t:l.total})),
    items:grp(lines,l=>l.name,l=>({n:l.qty,t:l.total})).slice(0,25),wItems:new Set(lines.filter(l=>l.byWeight).map(l=>l.name))};
  REPDATA=R;
  const bars=(arr,lab=x=>x)=>{const mx=Math.max(1,...arr.map(a=>a[1].t));return `<div class="bars">${arr.map(([k,v])=>`<div class="bar"><span>${esc(lab(k))}</span><div class="t"><i style="width:${v.t/mx*100}%"></i></div><span>${fmt(v.t)}</span></div>`).join('')||'<p class="mut">لا توجد بيانات</p>'}</div>`};
  $('#rep').innerHTML=`<div class="stats">
    <div class="stat g"><small>صافي المبيعات</small><b>${money(R.total)}</b></div><div class="stat s"><small>عدد الفواتير</small><b>${R.count}</b></div>
    <div class="stat"><small>متوسط الفاتورة</small><b>${money(R.count?R.total/R.count:0)}</b></div><div class="stat"><small>الخصومات</small><b>${money(R.disc)}</b></div>
    <div class="stat"><small>أجور التوصيل</small><b>${money(R.del)}</b></div><div class="stat r"><small>فواتير ملغاة</small><b>${R.canN} <small style="display:inline;font-size:13px">(${fmt(R.canT)})</small></b></div></div>
   ${R.byDev?`<div class="box" style="margin-bottom:16px"><h3>🖥️ المبيعات حسب الحاسبة</h3>${bars(R.byDev)}</div>`:''}
   <div class="grid2"><div class="box"><h3>👥 المبيعات حسب الكاشير</h3>${bars(R.byUser)}</div><div class="box"><h3>🍽️ حسب نوع الطلب</h3>${bars(R.byType)}</div>
    <div class="box"><h3>📂 حسب القسم</h3>${bars(R.byCat)}</div><div class="box"><h3>📅 حسب اليوم</h3>${bars(R.byDay,k=>{const [y,m,d]=k.split('-');return `${d}/${m}/${y}`})}</div></div>
   <div class="box" style="margin-top:16px"><h3>🏆 الأصناف الأكثر مبيعاً</h3><table class="tbl"><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>المبلغ</th></tr></thead><tbody>
    ${R.items.map(([k,v],i)=>`<tr><td>${i+1}</td><td>${esc(k)}</td><td class="num">${R.wItems.has(k)?r3(v.n)+' كغ':v.n}</td><td class="num"><b>${money(v.t)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="mut">لا توجد بيانات</td></tr>'}</tbody></table></div>`;
}
function printReport(){if(!REPDATA)return;const R=REPDATA,s=S.settings,d=new Date();const f=k=>{const [y,m,dd]=k.split('-');return `${dd}/${m}/${y}`};
  doPrint(`<div class="rc"><div class="rc-name">${esc(s.name)}</div><div class="rc-kitchen" style="margin-top:6px">تقرير المبيعات</div>

   <tr class="rc-grand"><td>صافي المبيعات</td><td>${fmt(R.total)} ${esc(s.currency)}</td></tr></table>
   ${R.byDev?`<table class="rc-items"><thead><tr><th>الحاسبة</th><th class="n">فواتير</th><th class="n">المبلغ</th></tr></thead><tbody>${R.byDev.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.t)}</td></tr>`).join('')}</tbody></table>`:''}
   <table class="rc-items"><thead><tr><th>الكاشير</th><th class="n">فواتير</th><th class="n">المبلغ</th></tr></thead><tbody>${R.byUser.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.t)}</td></tr>`).join('')}</tbody></table>
   <table class="rc-items"><thead><tr><th>القسم</th><th class="n">المبلغ</th></tr></thead><tbody>${R.byCat.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmt(v.t)}</td></tr>`).join('')}</tbody></table>
   <table class="rc-items"><thead><tr><th>الصنف</th><th class="n">الكمية</th><th class="n">المبلغ</th></tr></thead><tbody>${R.items.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${R.wItems.has(k)?r3(v.n)+'كغ':v.n}</td><td class="n">${fmt(v.t)}</td></tr>`).join('')}</tbody></table>

const SYNC={cfg:null,st:{localAt:0,remoteAt:0,sha:'',lastOk:0,err:''},busy:false,suspend:false,sig:'',pushT:null,loopT:null,api:localStorage.getItem('ghApi')||'https://api.github.com'};

async function syncInit(){

  setTimeout(()=>syncNow('auto'),1500);

function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function gh(method,path,body,cfg=SYNC.cfg){
  const r=await fetch(SYNC.api+path,{method,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,j};
}
const ghErr=(r)=>r.status===401?'التوكن غير صحيح أو منتهي':r.status===403?'التوكن لا يملك صلاحية (Contents: Read and write)':r.status===404?'المستودع أو الملف غير موجود / التوكن لا يرى المستودع':('خطأ من GitHub رقم '+r.status+(r.j&&r.j.message?' — '+r.j.message:''));
const FILE='data/catalog.json';
async function ghRead(cfg=SYNC.cfg){
  const r=await gh('GET',`/repos/${cfg.repo}/contents/${FILE}`,null,cfg);
  if(r.status===404)return {exists:false};
  if(!r.ok)throw new Error(ghErr(r));
  let c=r.j.content;
  if(!c||r.j.encoding==='none'){const b=await gh('GET',`/repos/${cfg.repo}/git/blobs/${r.j.sha}`,null,cfg);if(!b.ok)throw new Error(ghErr(b));c=b.j.content}
  const d=JSON.parse(b64dec(c));if(d.app!=='AbuSajjadPOS-catalog')throw new Error('ملف المزامنة غير صالح');
  return {exists:true,sha:r.j.sha,d};
}
async function ghWrite(sha){
  const at=SYNC.st.localAt||Date.now();
  const pick={};SYNC_SET.forEach(k=>pick[k]=S.settings[k]);
  const doc={app:'AbuSajjadPOS-catalog',v:1,at,by:SYNC.cfg.device||'',settings:pick,users:S.users,cats:S.cats,items:S.items};
  const body={message:`تحديث الأصناف والأسعار — ${SYNC.cfg.device||''} — ${dateStr(new Date(at))} ${time12(new Date(at))}`,content:b64enc(JSON.stringify(doc))};
  if(sha)body.sha=sha;
  const r=await gh('PUT',`/repos/${SYNC.cfg.repo}/contents/${FILE}`,body);
  if(r.status===409||r.status===422)return {conflict:true};
  if(!r.ok)throw new Error(ghErr(r));
  return {sha:r.j.content.sha,at};
}
async function applyRemote(d){
  SYNC.suspend=true;
  try{S.cats=d.cats||[];S.items=d.items||[];S.users=d.users&&d.users.length?d.users:S.users;

async function syncNow(mode='auto',silent=true){
  if(!SYNC.cfg||!SYNC.cfg.token)return;
  if(SYNC.busy){if(mode!=='auto')toast('المزامنة جارية، انتظر قليلاً','');return}
  SYNC.busy=true;updSyncStatus(true);
  try{
    for(let attempt=0;attempt<3;attempt++){
      const rem=await ghRead();
      const rAt=rem.exists?(rem.d.at||0):0;
      if(mode==='pull'){if(!rem.exists)throw new Error('لا توجد بيانات على GitHub بعد — ارفعها من الحاسبة الرئيسية أولاً');
        await applyRemote(rem.d);SYNC.st.localAt=rAt;SYNC.st.remoteAt=rAt;SYNC.st.sha=rem.sha;break}
      if(mode==='push')SYNC.st.localAt=Math.max(Date.now(),rAt+1);
      if(rem.exists&&rAt>SYNC.st.localAt){await applyRemote(rem.d);SYNC.st.localAt=rAt;SYNC.st.remoteAt=rAt;SYNC.st.sha=rem.sha;break}
      if(!rem.exists||SYNC.st.localAt>rAt){const w=await ghWrite(rem.exists?rem.sha:null);if(w.conflict){mode='auto';continue}
        SYNC.st.sha=w.sha;SYNC.st.remoteAt=w.at;if(!silent)toast('⬆️ تم رفع الأصناف والأسعار إلى GitHub','ok');break}
      if(!silent)toast('✔ البيانات متطابقة مع GitHub','ok');break;
    }
    SYNC.st.lastOk=Date.now();SYNC.st.err='';
  }catch(e){SYNC.st.err=e.message||'تعذر الاتصال بالإنترنت';if(!silent)toast('⚠️ المزامنة: '+SYNC.st.err,'err');else logErr&&logErr('SYNC '+SYNC.st.err)}
  finally{SYNC.busy=false;await DB.set('syncState',SYNC.st);updSyncStatus();const si=$('#syncInfo');if(si)si.innerHTML=syncInfoHTML()}
}

function salesDirty(day){if(!SYNC.cfg||!SYNC.cfg.token||!day)return;const m=day.slice(0,7);SYNC.st.dirty=SYNC.st.dirty||[];if(!SYNC.st.dirty.includes(m))SYNC.st.dirty.push(m);

async function ghPutJSON(path,doc,message){
  const content=b64enc(JSON.stringify(doc));
  for(let a=0;a<3;a++){
    const m=await gh('GET',`/repos/${SYNC.cfg.repo}/contents/${path}`);
    if(!m.ok&&m.status!==404)throw new Error(ghErr(m));
    const body={message,content};if(m.ok&&m.j&&m.j.sha)body.sha=m.j.sha;
    const r=await gh('PUT',`/repos/${SYNC.cfg.repo}/contents/${path}`,body);
    if(r.ok)return true;if(r.status!==409&&r.status!==422)throw new Error(ghErr(r));
  }
  throw new Error('تعارض أثناء رفع المبيعات');
}

async function ghList(path){const r=await gh('GET',`/repos/${SYNC.cfg.repo}/contents/${path}`);if(r.status===404)return [];if(!r.ok)throw new Error(ghErr(r));return Array.isArray(r.j)?r.j:[]}
const RCACHE={};
function monthsBetween(a,b){const out=[];let [y,m]=a.slice(0,7).split('-').map(Number);const [y2,m2]=b.slice(0,7).split('-').map(Number);let g=0;
  while((y<y2||(y===y2&&m<=m2))&&g++<240){out.push(`${y}-${pad(m)}`);m++;if(m>12){m=1;y++}}return out}
async function remoteInvoices(from,to,only){
  const months=monthsBetween(from==='0000'?'2020-01-01':from,to==='9999'?dayKey(new Date()):to);
  const devs=(await ghList('sales')).filter(d=>d.type==='dir'&&d.name!==SYNC.devId&&(!only||d.name===only));
  const out=[];let changed=false;
  await Promise.all(devs.map(async d=>{
    const files=(await ghList('sales/'+d.name)).filter(f=>months.includes(f.name.replace(/\.json$/,'')));
    await Promise.all(files.map(async f=>{
      let c=RCACHE[f.path];
      if(!c||c.sha!==f.sha){const b=await gh('GET',`/repos/${SYNC.cfg.repo}/git/blobs/${f.sha}`);if(!b.ok)throw new Error(ghErr(b));c=RCACHE[f.path]={sha:f.sha,doc:JSON.parse(b64dec(b.j.content))}}
      const nm=c.doc.device&&c.doc.device.name||d.name;if(SYNC.knownDevs[d.name]!==nm){SYNC.knownDevs[d.name]=nm;changed=true}
      c.doc.invoices.forEach(i=>{if(i.day>=from&&i.day<=to)out.push({...i,_dev:d.name,_devName:nm})});
    }));
  }));
  if(changed)DB.set('knownDevs',SYNC.knownDevs);
  return out;
}

function vkPress(k){
  const el=VK.t;if(!el||!document.body.contains(el)){vkHide();return}
  const fire=()=>el.dispatchEvent(new Event('input',{bubbles:true}));
  if(k==='HIDE'){vkHide();return}

  if(k==='LANG'){VK.lang=VK.lang==='ar'?'en':'ar';VK.shift=false;vkRender();return}
  if(k==='CLR'){el.value='';fire();vkRender();return}
  if(k==='ENT'){const t=el;t.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    if(t.tagName==='TEXTAREA'){ins('\n');return}
    if(t.form){const arr=[...t.form.querySelectorAll('input')].filter(vkOK);const i=arr.indexOf(t);if(i>=0&&i<arr.length-1){arr[i+1].focus();return}t.form.requestSubmit();}
    t.dispatchEvent(new Event('change',{bubbles:true}));if(VK.t===t)vkHide();return}
  if(k==='BS'){const s=el.selectionStart,e=el.selectionEnd;if(s!=null&&s!==e)el.setRangeText('',s,e,'end');else if(s>0)el.setRangeText('',s-1,s,'end');fire();vkRender();return}
  if(el.dataset.num){if(k==='.'&&el.value.includes('.'))return}
  ins(VK.lang==='en'&&VK.shift&&k.length===1?k.toUpperCase():k);

document.addEventListener('pointerup',()=>setTimeout(()=>{vkPtr=false},0),true);
document.addEventListener('click',()=>setTimeout(()=>{if(VK.t&&!vkOK(document.activeElement))vkHide()},0),true);
document.addEventListener('focusout',()=>setTimeout(function chk(){if(vkPtr)return setTimeout(chk,150);if(VK.t&&!vkOK(document.activeElement))vkHide()},400));
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.num){const c=t.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');if(c!==t.value)t.value=c}
  if(VK.t===t&&e.isTrusted)vkRender()},true);

/* ---------------- Keyboard ---------------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&VK.t){vkHide();return}
  if(e.key==='Escape'&&modalOpen()){closeModal();return}
  if(!ME||modalOpen())return;
  if(e.key==='F9'){e.preventDefault();if(VIEW==='pos')checkout(true)}
  if(e.key==='F8'){e.preventDefault();if(VIEW==='pos')checkout(false)}
  if(e.key==='F2'){e.preventDefault();if(VIEW!=='pos')go('pos');setTimeout(()=>$('#q')&&$('#q').focus(),50)}
});
$('#modalWrap').addEventListener('mousedown',e=>{if(e.target.id==='modalWrap')closeModal()});
document.addEventListener('contextmenu',e=>{if(!e.target.matches('input,textarea'))e.preventDefault()});
boot();
</script>
</body>
</html>
